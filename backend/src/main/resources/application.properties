spring.application.name=backend
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/tacs}

security.jwt.secret=${JWT_SECRET:?JWT_SECRET debe estar definida}
security.jwt.expiration-seconds=3600
security.admin.username=${ADMIN_USERNAME:}
security.admin.password=${ADMIN_PASSWORD:}

clima.chequeo.intervalo-ms=3600000

# Frecuencia del chequeo periodico para cerrar votaciones (en milisegundos). Default: 1 hora.
votacion.cierre.intervalo-ms=3600000

recordatorio.inicio.intervalo-ms=900000
# Anticipacion a usar cuando la actividad no tiene horasAnticipacion configurada.
recordatorio.inicio.horas-anticipacion-default=24

# --- Integracion con WeatherAPI.com (plan Business) ---
weatherapi.api-key=${WEATHERAPI_API_KEY:?WEATHERAPI_API_KEY debe estar definida}
weatherapi.base-url=https://api.weatherapi.com/v1

weatherapi.connect-timeout-ms=3000
weatherapi.read-timeout-ms=5000

# TTL del forecast cacheado por (ubicacion, rango de dias).
weatherapi.cache.ttl-seconds=1800

# Maximo de dias de forecast soportado por el plan.
weatherapi.forecast.max-days=14

# Circuit breaker: abre tras un 50% de fallas en la ventana de las ultimas 10 llamadas
# (con un minimo de 5), y prueba de nuevo a los 30s dejando pasar 3 llamadas de prueba.
resilience4j.circuitbreaker.instances.weatherApi.sliding-window-size=10
resilience4j.circuitbreaker.instances.weatherApi.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.weatherApi.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.weatherApi.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.weatherApi.permitted-number-of-calls-in-half-open-state=3

# Un rechazo del rate limiter no es una falla del proveedor: no debe contarse
# para la tasa de fallas que decide si el circuito se abre.
resilience4j.circuitbreaker.instances.weatherApi.ignore-exceptions=io.github.resilience4j.ratelimiter.RequestNotPermitted

# Rate limiter
resilience4j.ratelimiter.instances.weatherApi.limit-for-period=5
resilience4j.ratelimiter.instances.weatherApi.limit-refresh-period=1s
resilience4j.ratelimiter.instances.weatherApi.timeout-duration=0

# Retry: reintentos cortos ante fallas transitorias (timeouts, 5xx), antes de que el circuit
# breaker las cuente como falla definitiva.
resilience4j.retry.instances.weatherApi.max-attempts=3
resilience4j.retry.instances.weatherApi.wait-duration=500ms

# Un rechazo instantaneo (circuito abierto o rate limit superado) no se
# reintenta
# HttpClientErrorException (4xx: api key invalida, parametros mal armados) tampoco
# se reintenta: es un error permanente de la request, no algo transitorio del proveedor.
resilience4j.retry.instances.weatherApi.ignore-exceptions=io.github.resilience4j.circuitbreaker.CallNotPermittedException,io.github.resilience4j.ratelimiter.RequestNotPermitted,org.springframework.web.client.HttpClientErrorException

# --- Integracion con Telegram (Bot API) ---
telegram.bot-token=${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN debe estar definida}
telegram.bot-username=${TELEGRAM_BOT_USERNAME:?TELEGRAM_BOT_USERNAME debe estar definida}

telegram.connect-timeout-ms=3000

# Timeout de long polling: cuanto espera getUpdates a que haya un update nuevo
# antes de devolver una respuesta vacia (0 = short polling, no usar en prod).
telegram.polling.timeout-seconds=25

# Cuanto espera ante una request para cerrar la conexion. En la practica, debe ser mayor que el timeout de polling
telegram.read-timeout-ms=35000

# Pausa entre el fin de un getUpdates (con o sin resultados) y el siguiente.
# fixedDelay (no fixedRate): getUpdates ya bloquea hasta timeout-seconds cuando
# no hay novedades, no tiene sentido superponer corridas.
telegram.polling.delay-ms=500

# Vencimiento del token de un solo uso para vincular una cuenta ya existente
# (deep-link /start <token>).
telegram.vinculacion.expiracion-minutos=10

# Circuit breaker
resilience4j.circuitbreaker.instances.telegramApi.sliding-window-size=10
resilience4j.circuitbreaker.instances.telegramApi.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.telegramApi.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.telegramApi.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.telegramApi.permitted-number-of-calls-in-half-open-state=3

# Retry
resilience4j.retry.instances.telegramApi.max-attempts=3
resilience4j.retry.instances.telegramApi.wait-duration=500ms
resilience4j.retry.instances.telegramApi.ignore-exceptions=io.github.resilience4j.circuitbreaker.CallNotPermittedException,com.tacs.backend.exceptions.TelegramEnvioPermanenteException
