spring.application.name=backend

spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

security.jwt.secret=${JWT_SECRET:un_secreto_muy_largo_para_desarrollo_local_12345}
security.jwt.expiration-seconds=3600
security.admin.username=${ADMIN_USERNAME:}
security.admin.password=${ADMIN_PASSWORD:}

# Frecuencia del chequeo periodico de clima (en milisegundos). Default: 1 hora.
clima.chequeo.intervalo-ms=3600000
