name: CI Pipeline

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  build-and-test:
    name: Compile and Test Backend
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Grant execute permission for mvnw
        run: chmod +x mvnw
        working-directory: backend

      - name: Compile with Maven
        run: ./mvnw clean compile
        working-directory: backend
        
      - name: Run Tests
        run: ./mvnw test
        working-directory: backend
        env:
          JWT_SECRET: dummy-jwt-secret-key-needs-to-be-long-enough
          WEATHERAPI_API_KEY: dummy-weather-api-key
          TELEGRAM_BOT_TOKEN: dummy-bot-token
          TELEGRAM_BOT_USERNAME: dummybotusername

  frontend:
    name: Verify Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Check types and build
        working-directory: frontend
        run: npm run build
