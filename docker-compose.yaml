version: '3.8'

services:
  mongodb:
    image: mongo:6
    ports:
      - "27017:27017"

  backend:
    build:
      dockerfile: Dockerfile
      context: ./backend
    ports:
      - "8080:8080"
    depends_on:
      - mongodb
    environment:
      MONGODB_URI: "mongodb://mongodb:27017/tacs"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET debe estar definida}"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
